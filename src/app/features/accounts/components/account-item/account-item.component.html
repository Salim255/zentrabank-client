<div class="account-item" (click)="onOverview()">

  <header class="account-item__header">

    <div class="account-item__identity">

      <div class="account-item__icon">
        <lucide-icon [img]="Wallet"></lucide-icon>
      </div>

      <div class="account-item__heading">
        <h3 class="account-item__title">
          {{ account.type }} Account
        </h3>

        <span class="account-item__subtitle">
          Main account
        </span>
      </div>

    </div>

    <span
      class="account-item__status"
      [class.account-item__status--active]="account.status === 'ACTIVE'">
      {{ account.status }}
    </span>

  </header>

  <section class="account-item__balance">

    <strong class="account-item__amount">
      {{ account.balance | currency:account.currency }}
    </strong>

    <span class="account-item__balance-label">
      Balance
    </span>

  </section>

  <footer class="account-item__footer">

    <span class="account-item__currency">
      {{ account.currency }}
    </span>

    <span class="account-item__action">
      View account
      <lucide-icon [img]="ArrowRight"></lucide-icon>
    </span>

  </footer>

</div>
