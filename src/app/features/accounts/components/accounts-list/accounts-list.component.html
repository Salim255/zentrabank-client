<section class="accounts-list">

  @if (accounts().length) {

    <div class="accounts-list__rows">

      @for (item of accounts(); track item.id) {
        <app-account-item [account]="item"></app-account-item>
      }

    </div>

  }

  @else {

    <div class="accounts-list__empty">

      <lucide-icon [img]="Wallet"></lucide-icon>

      <h3>No accounts yet</h3>

      <p>Open your first account to start managing your finances.</p>

      <app-button variant="primary">Open Account</app-button>

    </div>

  }

</section>
