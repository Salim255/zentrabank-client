<section class="deposit-layout">

  <!-- ============================================
       PAGE HEADER — Banking Product
  ============================================ -->
  <header class="deposit-layout__header">
    <h1 class="deposit-layout__title">Deposit Funds</h1>
    <p class="deposit-layout__description">
      Add money to your ZentraBank account securely.
    </p>
  </header>

  <!-- ============================================
       PLACEHOLDER PANEL — Feature Not Available Yet
  ============================================ -->
  <section class="deposit-placeholder">

    <div class="deposit-placeholder__icon">
      <lucide-icon [img]="info"></lucide-icon>
    </div>

    <h2 class="deposit-placeholder__title">
      Deposit functionality is not available yet
    </h2>

    <p class="deposit-placeholder__text">
      We’re working on bringing secure deposit methods to your ZentraBank account.
      This feature will be available soon.
    </p>

    <app-button (click)="onBack()" variant="ghost">
      Back to Transactions
    </app-button>

  </section>

</section>
