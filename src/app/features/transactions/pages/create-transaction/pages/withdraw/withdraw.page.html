<section class="withdraw-layout">

  <!-- ============================================
       PAGE HEADER — Banking Product
  ============================================ -->
  <header class="withdraw-layout__header">
    <h1 class="withdraw-layout__title">Withdraw Funds</h1>
    <p class="withdraw-layout__description">
      Move money out of your ZentraBank account securely.
    </p>
  </header>

  <!-- ============================================
       PLACEHOLDER PANEL — Feature Not Available Yet
  ============================================ -->
  <section class="withdraw-placeholder">

    <div class="withdraw-placeholder__icon">
      <lucide-icon [img]="info"></lucide-icon>
    </div>

    <h2 class="withdraw-placeholder__title">
      Withdraw functionality is not available yet
    </h2>

    <p class="withdraw-placeholder__text">
      We’re working on enabling secure withdrawal methods for your ZentraBank account.
      This feature will be available soon.
    </p>

    <app-button variant="ghost">
      Back to Transactions
    </app-button>

  </section>

</section>
