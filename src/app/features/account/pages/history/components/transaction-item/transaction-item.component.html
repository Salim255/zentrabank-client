<article class="transaction-item">

    <!-- ======================================================
       HEADER
    ======================================================= -->

    <header class="transaction-item__header">

        <div class="transaction-item__identity">

            <div class="transaction-item__icon">

                <lucide-icon
                    name="arrow-down-left">
                </lucide-icon>

            </div>

            <div class="transaction-item__heading">

                <span class="transaction-item__badge">

                    Deposit

                </span>

                <h2 class="transaction-item__title">

                    Salary Payment

                </h2>

                <p class="transaction-item__description">

                    Monthly salary received from employer.

                </p>

            </div>

        </div>



        <div class="transaction-item__summary">

            <span class="transaction-item__amount transaction-item__amount--positive">

                + $2,850.00

            </span>

            <span class="transaction-item__status">

                Completed

            </span>

        </div>

    </header>





    <!-- ======================================================
       DETAILS
    ======================================================= -->

    <section class="transaction-item__details">

        <div class="transaction-item__detail">

            <span class="transaction-item__label">

                Date

            </span>

            <span class="transaction-item__value">

                Today · 09:42

            </span>

        </div>



        <div class="transaction-item__detail">

            <span class="transaction-item__label">

                Reference

            </span>

            <span class="transaction-item__value">

                TRX-93848320

            </span>

        </div>



        <div class="transaction-item__detail">

            <span class="transaction-item__label">

                Method

            </span>

            <span class="transaction-item__value">

                Bank Transfer

            </span>

        </div>



        <div class="transaction-item__detail">

            <span class="transaction-item__label">

                Balance After

            </span>

            <span class="transaction-item__value">

                $8,394.52

            </span>

        </div>

    </section>





    <!-- ======================================================
       FOOTER
    ======================================================= -->

    <footer class="transaction-item__footer">

        <button
            class="transaction-item__action"
            type="button">

            View Details

            <lucide-icon
                name="arrow-right">
            </lucide-icon>

        </button>

    </footer>

</article>
