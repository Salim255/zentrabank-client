<section class="transaction-summary">


  <!-- ======================================================
       HEADER
  ======================================================= -->

  <header class="transaction-summary__header">


    <div class="transaction-summary__heading">


      <h2 class="transaction-summary__title">

        Transaction Summary

      </h2>


      <p class="transaction-summary__description">

        Overview of your account activity and financial movements.

      </p>


    </div>


  </header>





  <!-- ======================================================
       SUMMARY GRID
  ======================================================= -->


  <div class="transaction-summary__grid">


    <article class="transaction-stat">


      <div class="transaction-stat__icon">

        <lucide-icon [img]="receipt"></lucide-icon>

      </div>


      <div class="transaction-stat__content">

        <span class="transaction-stat__label">

          Transactions

        </span>


        <strong class="transaction-stat__value">

          284

        </strong>


      </div>


    </article>





    <article class="transaction-stat">


      <div class="transaction-stat__icon transaction-stat__icon--success">

        <lucide-icon [img]="arrowDownLeft"></lucide-icon>

      </div>


      <div class="transaction-stat__content">

        <span class="transaction-stat__label">

          Money In

        </span>


        <strong class="transaction-stat__value transaction-stat__value--success">

          + £12,480

        </strong>


      </div>


    </article>






    <article class="transaction-stat">


      <div class="transaction-stat__icon transaction-stat__icon--danger">

        <lucide-icon [img]="arrowUpRight"></lucide-icon>

      </div>


      <div class="transaction-stat__content">

        <span class="transaction-stat__label">

          Money Out

        </span>


        <strong class="transaction-stat__value transaction-stat__value--danger">

          − £7,920

        </strong>


      </div>


    </article>







    <article class="transaction-stat transaction-stat--primary">


      <div class="transaction-stat__icon transaction-stat__icon--primary">

        <lucide-icon [img]="wallet"></lucide-icon>

      </div>


      <div class="transaction-stat__content">


        <span class="transaction-stat__label">

          Current Balance

        </span>


        <strong class="transaction-stat__value">

          £18,392

        </strong>


      </div>


    </article>


  </div>



</section>
